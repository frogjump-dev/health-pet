# Generate the Xcode project with: brew install xcodegen && xcodegen generate
name: HealthPet
options:
  bundleIdPrefix: com.ovenpals
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PetCore:
    path: Packages/PetCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  # HealthPet 3D: the app (3D方案, slice pets + v3 「干净版」 UI). The 2D HealthPet app was
  # retired on 2026-11-08; its last version is the tag 2d-final.
  HealthPet3D:
    type: application
    platform: iOS
    sources:
      - path: HealthPet3D
        excludes:
          - "PetWeb/**"
          - "tools/**"
          - "README.md"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: PetCore
      - package: Supabase
        product: Supabase
      - sdk: HealthKit.framework
      - sdk: WebKit.framework
    info:
      path: HealthPet3D/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ovenpals
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchCanvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Your pet reads your steps, workouts, active energy, sleep and heart rate variability to show your day and how rested you are. Data stays on your phone."
        NSHealthUpdateUsageDescription: "Ovenpals does not write to Apple Health."
        NSPhotoLibraryAddUsageDescription: "Save your share cards to Photos."
        # Settings → About opens these once they exist (https:// or mailto:); empty = "Soon".
        PrivacyPolicyURL: ""
        FeedbackURL: ""
        # The searchable line at the bottom of share cards: a short link once there is one
        # (e.g. "ovenpals.app"); empty = "iPhone app" under the name (PRD v0.3 §6).
        ShareLinkText: ""
        SupabaseProjectRef: $(SUPABASE_PROJECT_REF)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    entitlements:
      path: HealthPet3D/Resources/HealthPet3D.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # iCloud key-value backup (PRD v0.3 §9) and the App Group the widget will share. Both need
        # the paid developer account: register them on the App ID com.ovenpals.app before the
        # first TestFlight upload (see HealthPet3D/README.md). The simulator runs without that.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.security.application-groups:
          - group.com.ovenpals.app
    settings:
      base:
        # decided 2026-11-10; it can't change once a build is on TestFlight
        PRODUCT_BUNDLE_IDENTIFIER: com.ovenpals.app
        MARKETING_VERSION: "0.3.0"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set your Apple team id here (or in Xcode) to run on a device.
        DEVELOPMENT_TEAM: ""

schemes:
  HealthPet3D:
    build:
      targets:
        HealthPet3D: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PetCore/PetCoreTests
