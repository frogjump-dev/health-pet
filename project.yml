# Generate the Xcode project with: brew install xcodegen && xcodegen generate
name: HealthPet
options:
  bundleIdPrefix: com.healthpet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PetCore:
    path: Packages/PetCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  HealthPet:
    type: application
    platform: iOS
    sources:
      - path: HealthPet
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: PetCore
      - package: Supabase
        product: Supabase
      - sdk: HealthKit.framework
    info:
      path: HealthPet/Resources/Info.plist
      properties:
        CFBundleDisplayName: HealthPet
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [LilitaOne-Regular.ttf, Baloo2-ExtraBold.ttf, Baloo2-SemiBold.ttf]
        NSHealthShareUsageDescription: "Your pet reads your sleep, heart rate variability, resting heart rate and steps so it can feel how you feel. Data stays on your phone."
        NSHealthUpdateUsageDescription: "HealthPet does not write to Apple Health."
        NSPhotoLibraryAddUsageDescription: "Save your share cards to Photos."
        SupabaseProjectRef: $(SUPABASE_PROJECT_REF)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.healthpet.app
            CFBundleURLSchemes: [healthpet]
    entitlements:
      path: HealthPet/Resources/HealthPet.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthpet.app
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set your Apple team id here (or in Xcode) to run on a device.
        DEVELOPMENT_TEAM: ""

  # HealthPet 3D: the test build of the 3D方案 (slice pets + v3 「干净版」 UI). Installs next to
  # HealthPet; shares the health data layer below, everything on screen is in HealthPet3D/.
  HealthPet3D:
    type: application
    platform: iOS
    sources:
      - path: HealthPet3D
        excludes:
          - "PetWeb/**"
          - "tools/**"
          - "README.md"
      - path: HealthPet/App/AppModel.swift
      - path: HealthPet/Character
      - path: HealthPet/Health
      - path: HealthPet/Store
      - path: HealthPet/Backend
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: PetCore
      - package: Supabase
        product: Supabase
      - sdk: HealthKit.framework
      - sdk: WebKit.framework
    info:
      path: HealthPet3D/Resources/Info.plist
      properties:
        CFBundleDisplayName: HealthPet 3D
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchCanvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Your pet reads your steps, workouts, active energy, sleep and heart rate variability to show your day and how rested you are. Data stays on your phone."
        NSHealthUpdateUsageDescription: "HealthPet does not write to Apple Health."
        NSPhotoLibraryAddUsageDescription: "Save your share cards to Photos."
        SupabaseProjectRef: $(SUPABASE_PROJECT_REF)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    entitlements:
      path: HealthPet3D/Resources/HealthPet3D.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthpet.app3d
        MARKETING_VERSION: "0.3.0"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""

schemes:
  HealthPet:
    build:
      targets:
        HealthPet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PetCore/PetCoreTests
  HealthPet3D:
    build:
      targets:
        HealthPet3D: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PetCore/PetCoreTests
