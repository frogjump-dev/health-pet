<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: absolute; touch-action: none; }
  /* As in pet-svg3d's preview.html: a slice that carries a face sticker, a rim edge or a band
     (data-keep, set by paintParts) is always drawn, whatever the frame's slice culling says.
     Without it the waffle's grid, the baguette's cuts, the coffee bean's seam etc. disappear. */
  svg[data-keep] { display: block !important; }
  /* a low week (没电): the home floor is paler; the pet itself is never changed */
  #stage.low [data-rug] { opacity: .5; }
</style>
</head>
<body>
<div id="stage"></div>
<script>/*BUNDLE*/</script>
</body>
</html>
